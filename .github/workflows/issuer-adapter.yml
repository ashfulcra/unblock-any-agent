name: Reproduce optional issuer source
on:
  push:
    paths:
      - 'integrations/fulcra-issuer/**'
      - '.github/workflows/issuer-adapter.yml'
  pull_request:
    paths:
      - 'integrations/fulcra-issuer/**'
      - '.github/workflows/issuer-adapter.yml'
permissions:
  contents: read
jobs:
  issuer-source:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.13', '3.14']
    env:
      UNBLOCK_ISSUER_DIR: ${{ runner.temp }}/unblock-issuer-candidate
      UNBLOCK_ENABLED: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.10
      - name: Apply and verify the pinned source candidate
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path,PurePosixPath
          bundle=Path('integrations/fulcra-issuer').resolve()
          manifest=json.loads((bundle/'manifest.json').read_text())
          patch=bundle/'unblock.patch'
          assert hashlib.sha256(patch.read_bytes()).hexdigest()==manifest['patch']['sha256']
          target=Path(os.environ['UNBLOCK_ISSUER_DIR'])
          subprocess.run(['git','clone',manifest['upstream']['repository'],str(target)],check=True)
          subprocess.run(['git','-C',str(target),'checkout','--detach',manifest['upstream']['commit']],check=True)
          subprocess.run(['git','-C',str(target),'apply','--check',str(patch)],check=True)
          subprocess.run(['git','-C',str(target),'apply',str(patch)],check=True)
          for name,digest in manifest['result_files_sha256'].items():
              relative=PurePosixPath(name)
              assert not relative.is_absolute() and '..' not in relative.parts
              path=(target/name).resolve()
              assert path.is_relative_to(target.resolve())
              assert hashlib.sha256(path.read_bytes()).hexdigest()==digest,name
          PY
      - run: uv sync --locked --python '${{ matrix.python }}'
        working-directory: ${{ env.UNBLOCK_ISSUER_DIR }}
      - run: uv run --locked --python '${{ matrix.python }}' pytest -q
        working-directory: ${{ env.UNBLOCK_ISSUER_DIR }}
